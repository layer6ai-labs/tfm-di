model: tabdpt_seed456
# Borrow tabdpt's member/non-member dataset list (same training corpus,
# different seed) when run_di.py picks datasets to attack.
dataset_selection_model: tabdpt

# TabDPT trained with seed=456. Auto-downloaded from HF on first use if the
# local safetensors file is not present.
classifier:
  class_name: TabDPTClassifier
  import_path: tabdpt.TabDPTClassifier
  has_download_weights: false
  default_weight_path: runs/production/production_seed456/model.safetensors
  hf_repo: dwahdany/tfms
  hf_path: tabdpt/seed456/model.safetensors

regressor:
  class_name: TabDPTRegressor
  import_path: tabdpt.TabDPTRegressor
  has_download_weights: false
  default_weight_path: runs/production/production_seed456/model.safetensors
  hf_repo: dwahdany/tfms
  hf_path: tabdpt/seed456/model.safetensors
