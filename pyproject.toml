[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-di"
version = "0.0.1"
description = "Dataset Inference on TFMs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.11.0,<1.13.0",
    "h5py>=3.16.0",
    "huggingface-hub>=0.33.2,<2.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.8",
    "numpy>=1.25.0,<3.0",
    "omegaconf>=2.1.1,<3.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "safetensors>=0.5.3,<1.0",
    "scikit-learn>=1.4.0,<2.0",
    "scipy>=1.9.0,<2.0",
    "tabdpt>=1.1.12",
    "tabpfn>=6.4.1",
    "tfmplayground",
    "torch>=2.6.0,<3.0",
    "tqdm>=4.38.0,<5.0",
    "wandb",
    "xgboost>=3.2.0",
]

# Exact versions of the environment that produced the published audit tables.
# The dependency ranges above stay loose on purpose (collaborators install into
# their own envs); this block is the record. The LR/XGB internal cells and all
# four external rows are deterministic, so a version drift shows up immediately
# as a diff in `repro/reproduce_tables.py compare`.
[tool.tfm-di.reference-env]
python = "3.12.12"
numpy = "2.3.0"
scipy = "1.15.3"
scikit-learn = "1.7.0"
pandas = "2.3.2"
pyarrow = "23.0.0"
xgboost = "3.2.0"
tabpfn = "7.1.0"

[project.optional-dependencies]
# Second blind baseline. Not in the base deps because the checkpoint is 6.1 GB
# and only the blind-extraction runs need it. `safetensors` is listed
# explicitly: tabfm's PyTorch loader imports it but does not declare it, so a
# clean install fails with `NameError: name 'safetensors' is not defined`.
tabfm = [
    "tabfm[pytorch] @ git+https://github.com/google-research/tabfm",
    "safetensors>=0.5.3,<1.0",
]

sap-rpt-oss = [
    "transformers>=4.52.4",
    "torcheval>=0.0.7",
    "torch>=2.7.0",
    "scikit-learn>=1.6.1",
    "pandas>=2.2.3",
    "pyarrow>=20.0.0",
    "huggingface_hub",
    "sap-rpt-oss @ git+https://github.com/SAP-samples/sap-rpt-1-oss",
]

[project.urls]
Repository = "https://github.com/layer6ai-labs/tfm-di"

[tool.setuptools.packages.find]
include = ["di*"]

[tool.uv.sources]
tfmplayground = { path = "tfm_playground" }

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "rliable>=1.2.0,<2.0",
    "pandas>=2.3.2,<3.0",
    "openml>=0.15.1,<1.0",
    "jupyter>=1.1.1,<2.0",
    "tenacity>=9.1.2,<10.0",
    "gdown>=5.2.0,<6.0",
    "zstandard>=0.25.0",
]
